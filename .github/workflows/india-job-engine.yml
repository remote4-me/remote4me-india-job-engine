name: Remote4.me India Job Engine v4

on:
  workflow_dispatch:
  schedule:
    # 4 runs/day. Public feeds are polled no more than needed.
    - cron: "17 2,8,14,20 * * *"

permissions:
  contents: read

concurrency:
  group: remote4me-india-job-engine
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run crawler
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

          # Optional search layer. The keyless sources below work without these.
          MAX_SEARCH_QUERIES_PER_RUN: "80"
          MAX_RESULTS_PER_QUERY: "20"

          # Official-source resolution is the expensive part, so cap it.
          MAX_OFFICIAL_CHECKS: "350"

          # Public feed controls.
          ONJOB_MAX_PAGES: "20"
          WAYBACK_MAX_URLS_PER_QUERY: "100"
          CRAWL_DELAY: "0.5"
          REQUEST_TIMEOUT: "20"

        run: python -m src.main

      - name: Upload run logs if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote4me-india-engine-${{ github.run_number }}
          path: |
            data/
            logs/
          if-no-files-found: ignore
          retention-days: 7
