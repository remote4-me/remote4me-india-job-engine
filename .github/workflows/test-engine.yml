name: Test Remote4.me Engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run keyless discovery test
        env:
          MAX_OFFICIAL_CHECKS: "30"
          ONJOB_MAX_PAGES: "5"
          MAX_SEARCH_QUERIES_PER_RUN: "0"
          REQUEST_TIMEOUT: "20"
          CRAWL_DELAY: "0.3"
        run: python -m src.main --dry-run
