name: Remote4.me V11 Weekly Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 0"  # Sunday 09:00 IST

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: remote4me-discovery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover companies and ATS boards
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          STARTUP_JOBS_API_KEY: ${{ secrets.STARTUP_JOBS_API_KEY }}
          DISCOVERY_VALIDATE_PER_ATS: "1800"
          DISCOVERY_CANDIDATE_LIMIT: "6000"
          DISCOVERY_WORKERS: "36"
          PYTHONUNBUFFERED: "1"
        run: python crawler.py --discover
      - name: Commit refreshed manifests
        run: |
          git config user.name "Remote4.me Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/boards.json data/companies.json
          git diff --cached --quiet && echo "No manifest changes." && exit 0
          git commit -m "Refresh V11 company and ATS discovery manifests"
          git push
