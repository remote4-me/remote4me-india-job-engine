name: Remote4.me Weekly Bounded Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 0"  # Sunday 09:00 IST

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: remote4me-discovery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover companies and ATS boards
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          MANUAL_COMPANY_SHEET_NAME: ${{ vars.MANUAL_COMPANY_SHEET_NAME }}
          STARTUP_JOBS_API_KEY: ${{ secrets.STARTUP_JOBS_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SEARCH1_API_KEY: ${{ secrets.SEARCH1_API_KEY }}
          SEARLO_API_KEY: ${{ secrets.SEARLO_API_KEY }}
          PUBLIC_SERP_FALLBACK_ENABLED: "1"
          PUBLIC_SERP_QUERIES_PER_RUN: "12"
          SEARCH_API_PROVIDERS_PER_RUN: "1"
          SEARCH_EXPERIMENTAL_PROVIDERS_ENABLED: "0"
          GOOGLE_JOBS_MAX_QUERIES_PER_DAY: "1"
          DISCOVERY_VALIDATE_PER_ATS: "900"
          DISCOVERY_CANDIDATE_LIMIT: "6000"
          DISCOVERY_WORKERS: "16"
          ARCHIVE_DISCOVERY_INTERVAL_DAYS: "14"
          PYTHONUNBUFFERED: "1"
        run: python crawler.py --discover
      - name: Commit refreshed manifests
        run: |
          set -euo pipefail
          git config user.name "Remote4.me Bot"
          git config user.email "actions@users.noreply.github.com"

          mkdir -p /tmp/remote4me-manifests
          cp data/boards.json data/companies.json data/search_discovery.json data/google_jobs_usage.json /tmp/remote4me-manifests/

          git fetch origin main
          git reset --hard origin/main
          cp /tmp/remote4me-manifests/boards.json data/boards.json
          cp /tmp/remote4me-manifests/companies.json data/companies.json
          cp /tmp/remote4me-manifests/search_discovery.json data/search_discovery.json
          cp /tmp/remote4me-manifests/google_jobs_usage.json data/google_jobs_usage.json

          git add data/boards.json data/companies.json data/search_discovery.json data/google_jobs_usage.json
          if git diff --cached --quiet; then
            echo "No manifest changes."
          else
            git commit -m "Refresh company and ATS discovery manifests"
            git push origin HEAD:main
          fi
