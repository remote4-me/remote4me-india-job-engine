name: Remote4.me V15.1 Weekly Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 0"  # Sunday 09:00 IST

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: remote4me-discovery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover companies and ATS boards
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          MANUAL_COMPANY_SHEET_NAME: ${{ vars.MANUAL_COMPANY_SHEET_NAME }}
          STARTUP_JOBS_API_KEY: ${{ secrets.STARTUP_JOBS_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SEARCH1_API_KEY: ${{ secrets.SEARCH1_API_KEY }}
          SEARLO_API_KEY: ${{ secrets.SEARLO_API_KEY }}
          PUBLIC_SERP_FALLBACK_ENABLED: "1"
          PUBLIC_SERP_QUERIES_PER_RUN: "24"
          SEARCH_API_PROVIDERS_PER_RUN: "1"
          SEARCH_EXPERIMENTAL_PROVIDERS_ENABLED: "0"
          GOOGLE_JOBS_MAX_QUERIES_PER_DAY: "1"
          DISCOVERY_VALIDATE_PER_ATS: "500"
          DISCOVERY_CANDIDATE_LIMIT: "6000"
          DISCOVERY_WORKERS: "20"
          ARCHIVE_DISCOVERY_INTERVAL_DAYS: "1"
          PYTHONUNBUFFERED: "1"
        run: python crawler.py --discover
      - name: Commit refreshed manifests
        run: |
          git config user.name "Remote4.me Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/boards.json data/companies.json data/search_discovery.json data/google_jobs_usage.json
          git diff --cached --quiet && echo "No manifest changes." && exit 0
          git commit -m "Refresh V15.1 company and ATS discovery manifests"
          git push
