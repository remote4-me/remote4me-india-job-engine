name: Remote4.me India Support Job Engine — Stable Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"  # 17:00 IST

permissions:
  contents: write

concurrency:
  group: remote4me-v151-daily
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------
  # DISCOVERY: search engines + directories + ATS archives
  # ----------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh bounded discovery manifests
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SEARCH1_API_KEY: ${{ secrets.SEARCH1_API_KEY }}
          SEARLO_API_KEY: ${{ secrets.SEARLO_API_KEY }}
          SERPFAST_API_KEY: ${{ secrets.SERPFAST_API_KEY }}
          SERPENT_API_KEY: ${{ secrets.SERPENT_API_KEY }}
          ENDLESS_SEARCH_API_KEY: ${{ secrets.ENDLESS_SEARCH_API_KEY }}
          SERPSEARCH_API_KEY: ${{ secrets.SERPSEARCH_API_KEY }}
          FREESEA_API_KEY: ${{ secrets.FREESEA_API_KEY }}
          STARTUP_JOBS_API_KEY: ${{ secrets.STARTUP_JOBS_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          MANUAL_COMPANY_SHEET_NAME: ${{ vars.MANUAL_COMPANY_SHEET_NAME }}
          SEARCH_DISCOVERY_ENABLED: "1"
          PUBLIC_SERP_FALLBACK_ENABLED: "1"
          PUBLIC_SERP_QUERIES_PER_RUN: "12"
          PUBLIC_SERP_WORKERS: "4"
          SEARCH_QUERIES_PER_PROVIDER: "2"
          SEARCH_API_PROVIDERS_PER_RUN: "1"
          SEARCH_EXPERIMENTAL_PROVIDERS_ENABLED: "0"
          SEARCH_RESULTS_PER_QUERY: "10"
          SEARCH_DISCOVERY_ROTATION_DAYS: "10"
          SEARCH_DISCOVERY_MAX_URLS: "700"
          GOOGLE_DISCOVERY_ENABLED: "1"
          GOOGLE_DISCOVERY_QUERIES_PER_PROVIDER: "6"
          GOOGLE_DISCOVERY_RESULTS_PER_QUERY: "10"
          JOB_BOARD_QUERIES_PER_RUN: "4"
          JOB_BOARD_ROTATION_DAYS: "1"
          GOOGLE_DISCOVERY_ROTATION_DAYS: "1"
          GOOGLE_DISCOVERY_WORKERS: "8"
          GOOGLE_JOBS_ENABLED: "1"
          GOOGLE_JOBS_MAX_QUERIES_PER_DAY: "1"
          ALLOW_APAC_WORLDWIDE: "0"
          PUBLISH_APAC_WORLDWIDE: "0"
          GOOGLE_JOBS_RESULTS_PER_QUERY: "10"
          GOOGLE_JOBS_ROTATION_DAYS: "1"
          SERPAPI_ORGANIC_DISCOVERY_ENABLED: "0"
          GOOGLE_JOBS_USAGE_FILE: "data/google_jobs_usage.json"
          ARCHIVE_DISCOVERY_INTERVAL_DAYS: "30"
          COMPANY_DISCOVERY_LIMIT: "10000"
          DISCOVERY_CANDIDATE_LIMIT: "6000"
          DISCOVERY_VALIDATE_PER_ATS: "900"
          DISCOVERY_WORKERS: "16"
          PYTHONUNBUFFERED: "1"
        run: python crawler.py --discover
      - name: Package same-run discovery manifests
        run: |
          mkdir -p data
          if [ ! -f data/google_jobs_usage.json ]; then echo '{"date":"","calls":0}' > data/google_jobs_usage.json; fi
          test -s data/boards.json
          test -s data/companies.json
          test -s data/search_discovery.json
          tar -czf discovery-manifests.tgz \
            data/boards.json \
            data/companies.json \
            data/search_discovery.json \
            data/google_jobs_usage.json
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-manifests
          path: discovery-manifests.tgz
          if-no-files-found: error

  # ----------------------------------------------------------
  # DIRECT ATS SHARDS
  # ----------------------------------------------------------
  ats:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        ats: [Greenhouse, Lever, Ashby, Workable, SmartRecruiters, Recruitee, Breezy, Teamtailor, BambooHR, Personio, Workday, Nonstandard]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: remote4me-v151-${{ matrix.ats }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore same-run discovery manifests
        uses: actions/download-artifact@v4
        with:
          name: discovery-manifests
          path: .
      - name: Extract same-run discovery manifests
        run: tar -xzf discovery-manifests.tgz
      - name: Crawl ${{ matrix.ats }}
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          MANUAL_COMPANY_SHEET_NAME: ${{ vars.MANUAL_COMPANY_SHEET_NAME }}
          STARTUP_JOBS_API_KEY: ${{ secrets.STARTUP_JOBS_API_KEY }}
          PYTHONUNBUFFERED: "1"
          CRAWL_WORKERS: "20"
          HOST_CONCURRENCY: "4"
          JOB_MAX_AGE_DAYS: "30"
          ATS_DAILY_CAP: "400"
          NONSTANDARD_DAILY_BUDGET: "900"
          REQUEST_TIMEOUT: "8"
          HTML_TIMEOUT: "8"
          PLAYWRIGHT_ENABLED: "1"
          PLAYWRIGHT_TIMEOUT_MS: "12000"
          PLAYWRIGHT_CONCURRENT_BROWSERS: "2"
          CAREER_BROWSER_MAX_CALLS: "20"
          WORKDAY_MAX_PAGES_PER_KEYWORD: "1"
          WORKDAY_MAX_RESULTS_PER_BOARD: "120"
          WORKDAY_MAX_DETAIL_CALLS_PER_BOARD: "80"
          ALLOW_APAC_WORLDWIDE: "0"
          PUBLISH_APAC_WORLDWIDE: "0"
          EXTERNAL_FETCH_FALLBACK_ENABLED: "0"
        run: python crawler.py --ats "${{ matrix.ats }}" --out "out/${{ matrix.ats }}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ matrix.ats }}
          path: out/
          if-no-files-found: error

  # ----------------------------------------------------------
  # CUSTOM CAREER / JS CRAWLER
  # ----------------------------------------------------------
  careers:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: remote4me-v13-careers
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore same-run discovery manifests
        uses: actions/download-artifact@v4
        with:
          name: discovery-manifests
          path: .
      - name: Extract same-run discovery manifests
        run: tar -xzf discovery-manifests.tgz
      - name: Install Chromium for JS career pages
        run: python -m playwright install --with-deps chromium
      - name: Crawl direct company career pages
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          MANUAL_COMPANY_SHEET_NAME: ${{ vars.MANUAL_COMPANY_SHEET_NAME }}
          CAREER_DAILY_BUDGET: "1000"
          CAREER_CRAWL_BUDGET: "750"
          ATS_BOARD_BUDGET: "1800"
          DIRECT_DETAIL_BUDGET: "100"
          DISCOVERY_DETAIL_BUDGET: "120"
          AGGREGATOR_RESOLVE_BUDGET: "100"
          AGGREGATOR_SEARCH_FALLBACK_BUDGET: "12"
          CAREER_PAGE_LIMIT: "8"
          CAREER_HOMEPAGE_BUDGET: "25"
          HOMEPAGE_WORKERS: "10"
          HOMEPAGE_ROUTE_LIMIT: "8"
          CRAWL_WORKERS: "20"
          JOB_MAX_AGE_DAYS: "30"
          ALLOW_APAC_WORLDWIDE: "0"
          PUBLISH_APAC_WORLDWIDE: "0"
          CAREER_PREFLIGHT_ENABLED: "1"
          CAREER_PREFLIGHT_WORKERS: "16"
          CAREER_BROWSER_MAX_CALLS: "20"
          PLAYWRIGHT_CONCURRENT_BROWSERS: "2"
          PLAYWRIGHT_ENABLED: "1"
          PLAYWRIGHT_MAX_PAGES: "1"
          PLAYWRIGHT_TIMEOUT_MS: "12000"
          REQUEST_TIMEOUT: "8"
          HTML_TIMEOUT: "8"
          EXTERNAL_FETCH_FALLBACK_ENABLED: "0"
          EXTERNAL_FETCH_MAX_CALLS: "0"
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: "unblocker"
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SCRAPERAPI_API_KEY: ${{ secrets.SCRAPERAPI_API_KEY }}
          DIFFBOT_API_KEY: ${{ secrets.DIFFBOT_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python crawler.py --careers --out out/careers.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: jobs-careers
          path: out/
          if-no-files-found: error

  # ----------------------------------------------------------
  # PUBLIC JOB FEEDS / DISCOVERY SOURCES
  # ----------------------------------------------------------
  feeds:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore same-run discovery manifests
        uses: actions/download-artifact@v4
        with:
          name: discovery-manifests
          path: .
      - name: Extract same-run discovery manifests
        run: tar -xzf discovery-manifests.tgz
      - name: Fetch public feeds and build direct + discovery queues
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          MANUAL_COMPANY_SHEET_NAME: ${{ vars.MANUAL_COMPANY_SHEET_NAME }}
          STARTUP_JOBS_API_KEY: ${{ secrets.STARTUP_JOBS_API_KEY }}
          JOB_OPPORTUNITIES_API_KEY: ${{ secrets.JOB_OPPORTUNITIES_API_KEY }}
          JOBVETTA_API_KEY: ${{ secrets.JOBVETTA_API_KEY }}
          JOBVETTA_DAILY_QUERIES: "4"
          JOBVETTA_DAYS: "14"
          JOBVETTA_DETAIL_BUDGET: "20"
          JOA_DAILY_RECORD_BUDGET: "28"
          JOA_PAGE_SIZE: "10"
          HIMALAYAS_MAX_PAGES: "3"
          JOBICY_MAX_PAGES: "2"
          REMOTE_LANDERS_MAX_PAGES: "2"
          REMOTEJOBS_MAX_PAGES: "2"
          ARBEITNOW_MAX_PAGES: "5"
          STARTUP_JOBS_MAX_PAGES: "5"
          FEED_MAX_JOB_AGE_DAYS: "14"
          FEED_DISCOVERY_MAX_ROWS: "1500"
          PLAYWRIGHT_CONCURRENT_BROWSERS: "3"
          FEED_DIRECT_BUDGET: "350"
          JOB_MAX_AGE_DAYS: "30"
          ALLOW_APAC_WORLDWIDE: "0"
          PUBLISH_APAC_WORLDWIDE: "0"
          PYTHONUNBUFFERED: "1"
        run: python crawler.py --feeds --out out/feeds.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: jobs-feeds
          path: out/
          if-no-files-found: error

  # ----------------------------------------------------------
  # PUBLISH ONCE
  # ----------------------------------------------------------
  publish:
    needs: [ats, careers, feeds]
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: discovery-manifests
          path: .
      - name: Extract same-run discovery manifests
        run: tar -xzf discovery-manifests.tgz
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: jobs-*
          merge-multiple: true
      - name: Bring fresh Google discovery leads into merge
        run: |
          mkdir -p out
          cp data/search_discovery.json out/search_discovery.json
      - name: Merge, quality-check, and publish Remote + Hybrid Google Sheets tabs
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          MANUAL_COMPANY_SHEET_NAME: ${{ vars.MANUAL_COMPANY_SHEET_NAME }}
          PYTHONUNBUFFERED: "1"
        run: python crawler.py --merge out --write-sheet
      - name: Persist fresh discovery manifests
        if: success()
        run: |
          set -euo pipefail
          git config user.name "Remote4.me Bot"
          git config user.email "actions@users.noreply.github.com"

          # Start from the latest remote main to prevent non-fast-forward pushes.
          git fetch origin main
          git checkout -B main origin/main
          git reset --hard origin/main

          # Re-apply the manifests produced by this workflow run.
          tar -xzf discovery-manifests.tgz

          git add data/boards.json data/companies.json data/search_discovery.json data/google_jobs_usage.json

          if git diff --cached --quiet; then
            echo "Discovery manifests are unchanged; nothing to commit."
          else
            git commit -m "Refresh bounded discovery manifests"
            git push origin HEAD:main
          fi
      - name: Completion
        if: success()
        run: echo "Remote4.me daily crawl completed; remote jobs to JOBS/DISCOVERY and India-only hybrid jobs to HYBRID/HYBRID_DISCOVERY."
