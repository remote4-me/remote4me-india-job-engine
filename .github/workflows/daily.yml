name: Remote4.me V13 Daily High-Coverage Crawler

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *"  # 19:00 IST

permissions:
  contents: write

concurrency:
  group: remote4me-v13-daily
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------
  # DISCOVERY: search engines + directories + ATS archives
  # ----------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh discovery manifests
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SEARCH1_API_KEY: ${{ secrets.SEARCH1_API_KEY }}
          SEARLO_API_KEY: ${{ secrets.SEARLO_API_KEY }}
          STARTUP_JOBS_API_KEY: ${{ secrets.STARTUP_JOBS_API_KEY }}
          SEARCH_DISCOVERY_ENABLED: "1"
          SEARCH_QUERIES_PER_PROVIDER: "3"
          SEARCH_RESULTS_PER_QUERY: "10"
          SEARCH_DISCOVERY_ROTATION_DAYS: "10"
          SEARCH_DISCOVERY_MAX_URLS: "1200"
          ARCHIVE_DISCOVERY_INTERVAL_DAYS: "7"
          COMPANY_DISCOVERY_LIMIT: "15000"
          DISCOVERY_CANDIDATE_LIMIT: "6000"
          DISCOVERY_VALIDATE_PER_ATS: "1800"
          DISCOVERY_WORKERS: "36"
          PYTHONUNBUFFERED: "1"
        run: python crawler.py --discover
      - name: Commit refreshed manifests
        run: |
          git config user.name "Remote4.me Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/boards.json data/companies.json
          git diff --cached --quiet || (git commit -m "Refresh V13 ATS discovery manifests" && git push)

  # ----------------------------------------------------------
  # DIRECT ATS SHARDS
  # ----------------------------------------------------------
  ats:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        ats: [Greenhouse, Lever, Ashby, Workable, SmartRecruiters, Recruitee, Breezy, Teamtailor, BambooHR, Personio, Workday, Nonstandard]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: remote4me-v13-${{ matrix.ats }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl ${{ matrix.ats }}
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          STARTUP_JOBS_API_KEY: ${{ secrets.STARTUP_JOBS_API_KEY }}
          PYTHONUNBUFFERED: "1"
          CRAWL_WORKERS: "32"
          HOST_CONCURRENCY: "6"
          ALLOW_APAC_WORLDWIDE: "1"
          JOB_MAX_AGE_DAYS: "30"
          ATS_DAILY_CAP: "0"
          EXTERNAL_FETCH_FALLBACK_ENABLED: "0"
        run: python crawler.py --ats "${{ matrix.ats }}" --out "out/${{ matrix.ats }}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ matrix.ats }}
          path: out/
          if-no-files-found: error

  # ----------------------------------------------------------
  # CUSTOM CAREER / JS CRAWLER
  # ----------------------------------------------------------
  careers:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: remote4me-v13-careers
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Chromium for JS career pages
        run: python -m playwright install --with-deps chromium
      - name: Crawl direct company career pages
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          CAREER_DAILY_BUDGET: "1400"
          CAREER_PAGE_LIMIT: "4"
          PLAYWRIGHT_ENABLED: "1"
          PLAYWRIGHT_MAX_PAGES: "3"
          PLAYWRIGHT_TIMEOUT_MS: "25000"
          EXTERNAL_FETCH_FALLBACK_ENABLED: "1"
          EXTERNAL_FETCH_MAX_CALLS: "200"
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: "unblocker"
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SCRAPERAPI_API_KEY: ${{ secrets.SCRAPERAPI_API_KEY }}
          DIFFBOT_API_KEY: ${{ secrets.DIFFBOT_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python crawler.py --careers --out out/careers.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: jobs-careers
          path: out/
          if-no-files-found: error

  # ----------------------------------------------------------
  # PUBLIC JOB FEEDS / DISCOVERY SOURCES
  # ----------------------------------------------------------
  feeds:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch public feeds and resolve direct employer links
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          STARTUP_JOBS_API_KEY: ${{ secrets.STARTUP_JOBS_API_KEY }}
          JOB_OPPORTUNITIES_API_KEY: ${{ secrets.JOB_OPPORTUNITIES_API_KEY }}
          JOA_DAILY_RECORD_BUDGET: "28"
          JOA_PAGE_SIZE: "10"
          FEED_DIRECT_BUDGET: "350"
          JOB_MAX_AGE_DAYS: "30"
          PYTHONUNBUFFERED: "1"
        run: python crawler.py --feeds --out out/feeds.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: jobs-feeds
          path: out/
          if-no-files-found: error

  # ----------------------------------------------------------
  # PUBLISH ONCE
  # ----------------------------------------------------------
  publish:
    needs: [ats, careers, feeds]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: jobs-*
          merge-multiple: true
      - name: Merge and write Google Sheets
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PYTHONUNBUFFERED: "1"
        run: python crawler.py --merge out --write-sheet
      - name: Completion
        if: success()
        run: echo "Remote4.me V13 daily crawl and publish completed."
