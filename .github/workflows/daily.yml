name: Remote4.me V11 Daily Crawler

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *"  # 19:00 IST

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: check
        env:
          STARTUP_JOBS_API_KEY: ${{ secrets.STARTUP_JOBS_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          if [ -s data/boards.json ] && grep -q '"boards"' data/boards.json && ! grep -q '"board_count": 0' data/boards.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python crawler.py --discover
          git config user.name "Remote4.me Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/boards.json data/companies.json
          git diff --cached --quiet || (git commit -m "Bootstrap V11 discovery manifests" && git push)
          echo "ready=true" >> "$GITHUB_OUTPUT"

  ats:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        ats: [Greenhouse, Lever, Ashby, Workable, SmartRecruiters, Recruitee, Breezy, Teamtailor, BambooHR, Personio, Workday, Nonstandard]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: remote4me-${{ matrix.ats }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl ${{ matrix.ats }}
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          STARTUP_JOBS_API_KEY: ${{ secrets.STARTUP_JOBS_API_KEY }}
          PYTHONUNBUFFERED: "1"
          CRAWL_WORKERS: "32"
          HOST_CONCURRENCY: "6"
          ALLOW_APAC_WORLDWIDE: "1"
          JOB_MAX_AGE_DAYS: "30"
        run: python crawler.py --ats "${{ matrix.ats }}" --out "out/${{ matrix.ats }}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ matrix.ats }}
          path: out/
          if-no-files-found: error

  careers:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: remote4me-careers
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl direct company career pages
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          CAREER_DAILY_BUDGET: "1400"
          CAREER_PAGE_LIMIT: "4"
          PYTHONUNBUFFERED: "1"
        run: python crawler.py --careers --out out/careers.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: jobs-careers
          path: out/
          if-no-files-found: error

  feeds:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch public feeds and resolve direct employer links
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          STARTUP_JOBS_API_KEY: ${{ secrets.STARTUP_JOBS_API_KEY }}
          FEED_DIRECT_BUDGET: "350"
          PYTHONUNBUFFERED: "1"
        run: python crawler.py --feeds --out out/feeds.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: jobs-feeds
          path: out/
          if-no-files-found: error

  publish:
    needs: [ats, careers, feeds]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: jobs-*
          merge-multiple: true
      - name: Merge and write Google Sheets
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PYTHONUNBUFFERED: "1"
        run: python crawler.py --merge out --write-sheet
      - name: Completion
        if: success()
        run: echo "Remote4.me V11 daily crawl and publish completed."
