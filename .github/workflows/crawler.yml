name: Remote4.me India Job Crawler

on:
  workflow_dispatch:

  schedule:
    # 7:00 PM India Standard Time (IST)
    # 19:00 IST = 13:30 UTC
    - cron: "30 13 * * *"

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Remote4.me crawler
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          STARTUP_JOBS_API_KEY: ${{ secrets.STARTUP_JOBS_API_KEY }}
          JOB_MAX_AGE_DAYS: "7"
          ATS_WORKERS: "18"
          PYTHONUNBUFFERED: "1"
        run: |
          python crawler.py

      - name: Show completion message
        if: success()
        run: |
          echo "Remote4.me crawler completed successfully."
          echo "Scheduled time: 7:00 PM IST."
